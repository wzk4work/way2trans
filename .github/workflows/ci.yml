name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Test (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config clang-format \
            qt6-base-dev qt6-base-dev-tools \
            qt6-l10n-tools qt6-tools-dev \
            libqt6sql6-sqlite \
            dbus dbus-x11

      - name: clang-format check
        run: |
          shopt -s globstar nullglob
          files=(src/**/*.cpp src/**/*.h tests/**/*.cpp tests/**/*.h)
          echo "Checking ${#files[@]} files"
          clang-format --dry-run --Werror "${files[@]}"

      - name: Configure (dev)
        run: cmake --preset dev

      - name: Build (dev)
        run: cmake --build --preset dev

      - name: Test (dev)
        # Run ctest under a private session bus so D-Bus works headless. The
        # tests set QT_QPA_PLATFORM=offscreen themselves, so no X server needed.
        run: dbus-run-session -- ctest --preset dev

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build --preset release

  # Complements the Ubuntu job: Arch carries all optional dependencies
  # (Tesseract, LayerShellQt, xcb-keysyms), so this build exercises the
  # fully-featured configuration the AUR package will ship (DESIGN.md §11/§12),
  # while Ubuntu covers the minimal-dependency degradation path.
  build-arch:
    name: Build & Test (Arch Linux, full deps)
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm \
            cmake ninja gcc pkgconf git dbus \
            qt6-base qt6-tools \
            tesseract tesseract-data-eng leptonica \
            layer-shell-qt xcb-util-keysyms \
            ttf-dejavu

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (dev)
        run: cmake --preset dev

      - name: Build (dev)
        run: cmake --build --preset dev

      - name: Test (dev)
        run: dbus-run-session -- ctest --preset dev
